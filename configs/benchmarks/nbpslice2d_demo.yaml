name: nbpslice2d_demo
case_glob: ${USCT_NBP_CASE_GLOB:-../../data/nbpslice2d_demo/cases/*.h5}
outputs:
  root: ${USCT_RUN_ROOT:-../../runs}
algorithms:
  - id: cgls_default
    name: straight_cgls
    config: ../algorithms/cgls.yaml
  - id: sirt_default
    name: straight_sirt
    config: ../algorithms/sirt.yaml
  - id: sart_default
    name: straight_sart
    config: ../algorithms/sart.yaml
  - id: bent_default
    name: bent_ray_gn
    config: ../algorithms/bent_ray.yaml
# Property maps converted to straight-ray travel-time surrogates, not RF.
