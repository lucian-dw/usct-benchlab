# Manual comparison: each case must contain explicit ToF plus total pressure.
# Algorithm records distinguish travel_time (s) and complex_pressure (input units).
name: physics_pressure
case_glob: ${USCT_PRESSURE_CASE_GLOB:-../../data/physics/*/pressure_case.h5}
outputs:
  root: ${USCT_RUN_ROOT:-../../runs}
host_limits:
  max_iterations: 10
algorithms:
  - name: straight_cgls
    config: ../algorithms/cgls.yaml
  - name: straight_sirt
    config: ../algorithms/sirt.yaml
  - name: straight_sart
    config: ../algorithms/sart.yaml
  - name: bent_ray_gn
    config: ../algorithms/bent_ray.yaml
  - name: rwave_adapter
    config: ../algorithms/rwave.yaml
